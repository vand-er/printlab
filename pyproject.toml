[project]
name = "printlab"
version = "0.1.0"
description = "Agent-designed functional parts for a Bambu Lab X1C"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.10,<0.14",
    "trimesh>=4.0",
    "matplotlib>=3.8",
]

[project.scripts]
printlab = "printlab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printlab"]

[tool.pytest.ini_options]
testpaths = ["tests", "parts"]
addopts = "--import-mode=importlib"
