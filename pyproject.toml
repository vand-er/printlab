[project]
name = "printlab"
version = "0.1.0"
description = "Agent-designed functional parts for a Bambu Lab X1C"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d>=0.10,<0.14",
    "trimesh>=4.0",
    "matplotlib>=3.8",
]

[project.scripts]
printlab = "printlab.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printlab"]

[tool.pytest.ini_options]
testpaths = ["tests", "parts"]
# Parallel by default; pass -n 0 to run one test quickly.
addopts = "--import-mode=importlib -m 'not slow' -n auto"
markers = ["slow: minutes-long perturbation audits; run with -m slow -n 0 (nudge.audit pools the CPUs)"]

[tool.ruff]
line-length = 110
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip() strict=: every zip here pairs fixed-length tuples
