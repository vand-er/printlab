name: ci

# GitHub-hosted: the repo is public, so its runners are free. The slow audits run one job per
# part, in parallel, so none comes near GitHub's 6-hour job limit.
# Push only: a PR shows its head's push run, so a pull_request trigger would run it twice.
on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: [clamp, clamp-test-plate, clamp-lever-strip, clamp-gap-strip, clamp-pin-strip]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q -m slow -n 0 parts/${{ matrix.part }}
